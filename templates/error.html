{% extends 'base.html' %}
{% block title %}Error {{ code }} - {{ app_name }}{% endblock %}
{% block content %}
<div class="text-center py-16">
    <p class="text-6xl font-extrabold text-indigo-900">{{ code }}</p>
    <p class="text-slate-600 mt-4">{{ message }}</p>
    <a href="{{ url_for('katalog') }}" class="inline-block mt-6 bg-indigo-700 hover:bg-indigo-800 text-white px-5 py-2 rounded-lg text-sm">Kembali ke Katalog</a>
</div>
{% endblock %}
