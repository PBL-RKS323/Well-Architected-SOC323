{% extends 'layouts/toko.html' %}
{% block title %}Error {{ code }} - {{ app_name }}{% endblock %}
{% block content %}
<div class="text-center py-16">
    <p class="font-display text-7xl font-extrabold text-brand">{{ code }}</p>
    <p class="text-muted mt-4">{{ message }}</p>
    <a href="{{ url_for('toko.beranda') }}" class="inline-block mt-6 bg-brand hover:bg-brand-dark text-white font-medium px-6 py-3 rounded-full">Kembali ke Beranda</a>
</div>
{% endblock %}
