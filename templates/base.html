<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }} - Your One-Stop Electronic Market{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
            --font-display: "Plus Jakarta Sans", "Inter", ui-sans-serif, sans-serif;
            --color-brand: #F05537;
            --color-brand-dark: #D94426;
            --color-brand-soft: #FFF2EE;
            --color-ink: #1A1D20;
            --color-muted: #71777D;
            --color-soft: #F8F9FA;
            --color-peach: #FFF2EE;
            --color-coral: #F05537;
        }
        .scrollbar-none { scrollbar-width: none; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
    </style>
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body class="bg-soft text-ink font-sans antialiased min-h-screen {% block body_class %}{% endblock %}">
    {% if config.DEMO_MODE %}
    <p role="note" class="bg-ink text-white text-xs text-center px-4 py-2">
        Toko demo tugas kuliah (PBL Polibatam). Produk tidak benar-benar dijual, jangan melakukan transfer sungguhan.
    </p>
    {% endif %}
    {% block body %}{% endblock %}
</body>
</html>
