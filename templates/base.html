<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    {# Palet & tipografi mengikuti moodboard desain (Figma) #}
    <style type="text/tailwindcss">
        @theme {
            --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
            --font-display: "Plus Jakarta Sans", "Inter", ui-sans-serif, sans-serif;
            --color-brand: #2F80ED;
            --color-brand-dark: #1B5FC1;
            --color-brand-soft: #EAF2FD;
            --color-ink: #1F2937;
            --color-muted: #6B7280;
            --color-soft: #F4F6F8;
            --color-peach: #FDF0EA;
            --color-coral: #F04438;
            --color-sun: #F5A623;
        }
        .scrollbar-none { scrollbar-width: none; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
    </style>
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body class="bg-soft text-ink font-sans antialiased min-h-screen {% block body_class %}{% endblock %}">
    {% block body %}{% endblock %}
</body>
</html>
