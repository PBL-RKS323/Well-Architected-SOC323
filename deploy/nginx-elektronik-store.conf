# Salin ke /etc/nginx/sites-available/elektronik-store lalu buat symlink ke sites-enabled.
# Blok HTTPS (listen 443 + sertifikat) ditambahkan otomatis oleh: certbot --nginx -d toko.neteye.my.id
server {
    listen 80;
    listen [::]:80;
    server_name toko.neteye.my.id;

    # Sama dengan MAX_CONTENT_LENGTH di config.py (3 MB)
    client_max_body_size 3m;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # File statis (CSS/JS/foto produk) langsung dari Nginx. Bukti bayar TIDAK ada di sini
    # (disimpan di instance/bukti_bayar dan hanya lewat aplikasi dengan cek hak akses).
    location /static/ {
        alias /opt/elektronik-store/static/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
